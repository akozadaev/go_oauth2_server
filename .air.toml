root = "."
tmp_dir = "tmp/air"

[build]
cmd = "go build -o ./tmp/air/server ./cmd/server/"
entrypoint = ["./tmp/air/server"]
include_ext = ["go", "sql"]
include_file = ["go.mod", "go.sum", ".env"]
exclude_dir = [".git", "tmp", "vendor", ".modcache", "nginx", "docs"]
exclude_regex = ["_test\\.go$"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "5s"

[misc]
clean_on_exit = true
