# Дополнение к docker-compose.yml, а не самостоятельный стек.
# docker-compose -f docker-compose.yml -f docker-compose.scalable.yml --profile scalable up -d
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.scalable:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - oauth2-network
    depends_on:
      oauth2-server:
        condition: service_healthy
    profiles:
      - scalable

  oauth2-server:
    # Репликам нужны автоматически назначаемые имена и внутренние порты.
    container_name: !reset null
    ports: !reset []
    environment:
      LOG_LEVEL: info
    deploy:
      replicas: 3

  postgres:
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  prometheus:
    profiles:
      - scalable
      - monitoring

  grafana:
    profiles:
      - scalable
      - monitoring
